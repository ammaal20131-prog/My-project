<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ملف المعلمة أمل الشهري</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: calm sage header band carrying ownership (teacher + principal), pill nav, then one working view at a time */
:root{
  --bg:#F3F5F1; --card:#FFFFFF; --fg:#24312C; --muted:#68776F; --line:#DCE3DD;
  --sage:#4E8573; --sage-2:#E5EFEA; --sage-3:#CFE2D9; --sand:#F5EEE2; --sand-fg:#8A6A3B;
  --bad:#B4574B; --bad-bg:#F7E6E2; --warn:#9A6E22; --warn-bg:#F8EFDB; --good:#3C7D5B; --good-bg:#E2F1E7; --info:#4F6E91; --info-bg:#E5ECF4;
  --display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A18; --card:#1C2421; --fg:#E3ECE7; --muted:#9AAEA5; --line:#2C3833; --sage:#7DBBA5; --sage-2:#1F2E29; --sage-3:#29413A; --sand:#2A2620; --sand-fg:#D9B783;
  --bad:#E7988D; --bad-bg:#3A2522; --warn:#E3BF73; --warn-bg:#352B17; --good:#86CDA4; --good-bg:#1A3024; --info:#9DB8DA; --info-bg:#1E2836; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18; --card:#1C2421; --fg:#E3ECE7; --muted:#9AAEA5; --line:#2C3833; --sage:#7DBBA5; --sage-2:#1F2E29; --sage-3:#29413A; --sand:#2A2620; --sand-fg:#D9B783;
  --bad:#E7988D; --bad-bg:#3A2522; --warn:#E3BF73; --warn-bg:#352B17; --good:#86CDA4; --good-bg:#1A3024; --info:#9DB8DA; --info-bg:#1E2836; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sage-2)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sage-2);border-bottom:1px solid var(--sage-3)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px 8px}
.bar .logo{width:58px;height:auto;background:#fff;border-radius:12px;padding:3px;flex:none}
.bar .t{display:flex;flex-direction:column;min-width:0;flex:1}
.bar .t b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.3}
.bar .t span{font-size:13px;color:var(--muted)}
.owner{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px;color:var(--muted);text-align:left}
.owner b{color:var(--fg);font-weight:600}
.role{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--card);color:var(--sage);border:1px solid var(--sage-3)}
@media (max-width:640px){.owner{display:none}}
nav.tabs{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs button{flex:none;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:7px 15px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{background:var(--card)}
nav.tabs button[aria-current="page"]{background:var(--card);color:var(--sage);border-color:var(--sage-3);box-shadow:0 1px 2px rgba(0,0,0,.04)}
main{max-width:1120px;margin:0 auto;padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.lead{color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:linear-gradient(135deg,var(--sage-2),var(--sand));border:1px solid var(--sage-3);border-radius:18px;padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero .who{display:flex;flex-direction:column;gap:2px}
.hero .who small{color:var(--muted)}
.hero .who b{font-family:var(--display);font-size:22px}
.people{display:flex;gap:10px;flex-wrap:wrap}
.person{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.person b{color:var(--fg);font-size:14.5px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--good)}.kpi.info b{color:var(--info)}
.ccard{display:flex;flex-direction:column;gap:10px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--fg);font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--sage);transform:translateY(-2px)}
.ccard .h{display:flex;align-items:center;gap:12px}
.badge{flex:none;width:48px;height:48px;border-radius:13px;background:var(--sage-2);color:var(--sage);border:1px solid var(--sage-3);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.ccard .nm{font-family:var(--display);font-weight:600;font-size:18px}
.ccard .sb{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.mut{background:var(--sage-2);color:var(--muted)}.pill.info{background:var(--info-bg);color:var(--info)}
.meter{height:9px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--sage);border-color:var(--sage);color:var(--card)}
.btn.sm{font-size:12.5px;padding:3px 10px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label.btn:focus-within{outline:2px solid var(--sage);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;background:var(--sage-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:6px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--sage);box-shadow:0 1px 2px rgba(0,0,0,.06)}
select,input[type=text],input[type=number],input[type=search],input[type=url],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}
textarea{width:100%;min-height:70px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.g tbody tr:hover td{background:var(--sage-2)}
table.g th{background:var(--sage-2);font-weight:600;font-size:13px;position:sticky;top:0;color:var(--fg)}
table.g td.n{text-align:right;font-weight:600;position:sticky;right:0;background:var(--card)}
table.g th.n{position:sticky;right:0;z-index:1;text-align:right}
table.g input{width:60px;text-align:center;padding:4px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.cell-bad{color:var(--bad);font-weight:700}
.nmcell{display:flex;align-items:center;gap:8px;justify-content:space-between}
.fold{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--info-bg);color:var(--info);text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.fold.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
details.pc{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.pc[open]{border-color:var(--sage)}
details.pc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
details.pc summary::-webkit-details-marker{display:none}
details.pc .nm{font-weight:600;flex:1;min-width:150px}
.pbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.chk{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.chk h3{margin:0 0 4px;font-size:13.5px;color:var(--sage)}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:14px;z-index:60}
.empty{color:var(--muted);text-align:center;padding:28px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,18,15,.6);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ovw{width:100%;max-width:880px;display:flex;flex-direction:column;gap:10px}
.sheet{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cname{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;color:var(--fg);cursor:pointer}
.cname:hover{border-color:var(--sage)}
.cname b{font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(100px,160px) 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.bars .tr{height:14px;background:var(--sage-2);border-radius:7px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--sage);border-radius:7px}
.bars .v{font-variant-numeric:tabular-nums;text-align:left}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.d1{background:#3C7D5B}.d2{background:#79AE8C}.d3{background:#D7B266}.d4{background:#DD9467}.d5{background:#C26557}.d0{background:var(--line)}
footer.sign{max-width:1120px;margin:0 auto;padding-block:0 30px;text-align:center;color:var(--muted);font-size:13px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fbtn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--sand);border:1px solid var(--line);color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
a.fbtn:hover{transform:translateY(-2px);border-color:var(--sand-fg)}
.fbtn span{display:flex;flex-direction:column}.fbtn b{font-family:var(--display);font-size:17px}.fbtn small{color:var(--muted);font-size:12.5px}
.fbtn.off{opacity:.55}
table.g.pt td.wrap{white-space:normal;min-width:110px;font-size:13px}table.g.pt td.n.wrap{min-width:200px;position:static}table.g.pt th.n{position:static}
.fbtn.mine{background:var(--sage-2)}.fbtn.ach{background:#EFE8F7}:root[data-theme="dark"] .fbtn.ach{background:var(--info-bg)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fbtn.ach{background:var(--info-bg)}}.fbtn.init{background:#F6E9DF}:root[data-theme="dark"] .fbtn.init{background:var(--sand)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fbtn.init{background:var(--sand)}}.fbtn.comm{background:#F6E9DF}:root[data-theme="dark"] .fbtn.comm{background:var(--sand)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fbtn.comm{background:var(--sand)}}.fbtn.lesson{background:var(--info-bg)}
.kpi b{font-size:32px}

/* cover + tiles */
body.is-home header.top{display:none}
body.is-home main{padding-top:max(16px,env(safe-area-inset-top,0px))}
.cover{position:relative;overflow:hidden;border-radius:24px;padding:40px 24px 0;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,#6FA894 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#C9A46A 0%,transparent 60%),linear-gradient(135deg,#3E7363,#2E5A4D)}
.cover::after{content:"";position:absolute;inset:auto -60px -90px auto;width:280px;height:280px;border-radius:50%;border:38px solid rgba(255,255,255,.07)}
.cv-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.cv-logo{width:96px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
.cv-k{margin:10px 0 0;font-size:13.5px;opacity:.85}
.cv-t{font-family:var(--display);font-size:clamp(30px,6vw,46px);font-weight:700;margin:0;line-height:1.25;color:#fff}
.cv-s{margin:0;font-size:15px;opacity:.9}
.cv-p{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.cv-p span{display:flex;flex-direction:column;font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 16px;backdrop-filter:blur(4px)}
.cv-p b{font-size:16px;font-weight:600}
.cv-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);margin:28px -24px 0;background:rgba(0,0,0,.14);border-top:1px solid rgba(255,255,255,.15)}
.cv-stats div{display:flex;flex-direction:column;align-items:center;padding:14px 6px;font-size:12.5px;opacity:.95}
.cv-stats div+div{border-inline-start:1px solid rgba(255,255,255,.15)}
.cv-stats b{font-family:var(--display);font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
@media (max-width:560px){.cv-stats{grid-template-columns:repeat(2,1fr)}.cv-stats div:nth-child(3){border-inline-start:0}.cv-stats div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.15)}}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.tile{display:flex;align-items:center;gap:14px;text-align:right;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(30,60,50,.45);border-color:var(--tc)}
.tile .ti{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:var(--tc);background:var(--tb)}
.tile .tt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.tile b{font-family:var(--display);font-size:18px;font-weight:600}
.tile small{color:var(--muted);font-size:13px;line-height:1.5}
.tile em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--tc);margin-top:4px}
.tile .ta{color:var(--muted);font-size:22px}
.t1{--tc:#3C7D5B;--tb:#E2F1E7}.t2{--tc:#9A6E22;--tb:#F8EFDB}.t3{--tc:#4F6E91;--tb:#E5ECF4}.t4{--tc:#B4574B;--tb:#F7E6E2}.t5{--tc:#7A5AA6;--tb:#EFE8F7}.t6{--tc:#2F7C86;--tb:#E0F0F1}.t7{--tc:#68776F;--tb:#ECEFEC}.t8{--tc:#A0623A;--tb:#F6E9DF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile{--tb:rgba(255,255,255,.06)}:root:not([data-theme="light"]) .t1{--tc:#86CDA4}:root:not([data-theme="light"]) .t2{--tc:#E3BF73}:root:not([data-theme="light"]) .t3{--tc:#9DB8DA}:root:not([data-theme="light"]) .t4{--tc:#E7988D}:root:not([data-theme="light"]) .t5{--tc:#C3A8E6}:root:not([data-theme="light"]) .t6{--tc:#7FC7CF}:root:not([data-theme="light"]) .t7{--tc:#9AAEA5}:root:not([data-theme="light"]) .t8{--tc:#E5A97E}}
:root[data-theme="dark"] .tile{--tb:rgba(255,255,255,.06)}
.back{align-self:flex-start}
/* certificate: fixed 1414px print object, shown scaled */
.cwrapper{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 14px 34px -18px rgba(0,0,0,.5)}

.cert .band{position:absolute;height:64px;width:900px;transform:rotate(-38deg)}
.cert .b1{background:linear-gradient(90deg,#C77DB5,#B565A7);top:-42px;right:-212px}.cert .b2{background:#6E56A6;height:30px;top:-28px;right:57px}
.cert .b5{background:rgba(255,255,255,.6);height:16px;top:37px;right:-127px}
.cert .b3{background:linear-gradient(90deg,#C77DB5,#B565A7);bottom:-42px;left:-212px}.cert .b4{background:#6E56A6;height:30px;bottom:-28px;left:57px}
.cert .b6{background:rgba(255,255,255,.6);height:16px;bottom:37px;left:-127px}
.cert .b7{background:#6E56A6;height:25px;width:424px;top:523px;right:-170px}.cert .b8{background:#6E56A6;height:25px;width:424px;bottom:523px;left:-170px}
.cert .card{position:absolute;inset:62px 72px;background:#fff;border:1px solid #DCD8E6;padding:14px;box-shadow:0 12px 34px -14px rgba(60,40,100,.3)}
.cert .inner{height:100%;border:1px solid #E9E6F0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 84px 34px;background:linear-gradient(180deg,#fff 70%,#F6F4FA)}
.cert .head{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}

.cert .sig b{font-weight:700;color:#6E56A6}

.cert .ln img{max-height:84px;max-width:210px;transform:translateY(14px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function evalStudent(c,s){
  const g=(c.grades||{})[s.id]||{}, tools=c.tools||[], weakT=(S.config.weak??50)/100, enrT=(S.config.enrich??90)/100;
  let got=0,max=0,weak=[],pending=[];
  for(const t of tools){const v=g[t.id];if(v==null||v===""){pending.push(t);continue}got+=+v;max+=+t.max;if(+v/ +t.max<weakT)weak.push(t)}
  const pct=max?got/max:null, total=(tools||[]).reduce((a,t)=>a+ +t.max,0);
  let st="norm"; if(weak.length)st="rem"; else if(pct!=null&&pct>=enrT)st="enr";
  const pt=tools.filter(t=>PROJ.includes(t.id)), projFull=pt.length>0&&pt.every(t=>+g[t.id]===+t.max);
  const full=!pending.length&&total>0&&got>=total;
  return {g,got,max,total,pct,weak,pending,st,projFull,full};
}
function classStats(c){
  const rows=(c.students||[]).map(s=>({s,...evalStudent(c,s)}));
  const graded=rows.filter(r=>r.pct!=null), avg=graded.length?graded.reduce((a,r)=>a+r.pct,0)/graded.length:null;
  const band=[0,0,0,0,0,0];
  for(const r of rows){if(r.pct==null){band[0]++;continue}const p=r.pct*100;band[p>=90?1:p>=80?2:p>=65?3:p>=50?4:5]++}
  return {rows,avg,rem:rows.filter(r=>r.st==="rem").length,enr:rows.filter(r=>r.st==="enr").length,proj:rows.filter(r=>r.projFull).length,full:rows.filter(r=>r.full).length,band};
}

  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>📊 قراءة المجلدات</h2><span class="lead" style="font-size:13px">آخر قراءة: ${fdate(c.folderScanAt)}</span></div>

   <td>${e?'<span class="pill bad">فارغ</span>':(isNew(x)?`<span class="pill info">جديد · ${fdate(x.last)}</span>`:`<span class="num" style="color:var(--muted)">${fdate(x.last)}</span>`)}</td></tr>`}).join("")}</tbody></table></div>

function matchName(c,raw){const n=norm(raw).split(" ");if(!n[0])return null;let best=null,bs=0,amb=false;
  for(const s of c.students||[]){const t=norm(s.name).split(" ");if(t[0]!==n[0])continue;let sc=1;for(const w of n.slice(1))if(t.includes(w))sc++;
    if(sc>bs){bs=sc;best=s;amb=false}else if(sc===bs)amb=true}
  return amb?null:(bs>=Math.min(2,n.length)?best:null)}
async function importFile(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}), ws=wb.Sheets[wb.SheetNames[0]], A=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  const hi=A.findIndex(r=>r.some(x=>String(x).trim()==="الاسم")&&r.some(x=>String(x).trim()==="الدرجة"));
  if(hi<0){toast("لم أجد عمودي «الاسم» و«الدرجة» في الملف");return}
  const H=A[hi].map(x=>String(x).trim()),iN=H.indexOf("الاسم"),iG=H.indexOf("الدرجة"),iM=H.indexOf("من"),iC=H.indexOf("الفصل");
  const recs=A.slice(hi+1).filter(r=>r[iN]&&r[iG]!==""&&!isNaN(+r[iG])).map(r=>({name:String(r[iN]).trim(),g:+r[iG],max:iM>=0?+r[iM]||10:10,cls:iC>=0?String(r[iC]):""}));
  const c=S.classes[S.cls], tools=c.tools||[];
  const res=recs.map(r=>{let cid=S.cls;if(r.cls){const hit=classList().find(([id,cc])=>{const m=cc.name.match(/(\S+)\s*متوسط\s*(\S+)/);return m&&r.cls.includes(m[1])&&r.cls.replace(/[()]/g," ").includes(m[2])});if(hit)cid=hit[0]}
    return {...r,cid,s:matchName(S.classes[cid],r.name)}});
  S.imp={res,defMax:recs[0]?.max||10};
  $("#ovw").innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between"><h2>رصد نتائج من تحضيري</h2><button class="btn" id="ovx">✕</button></div>
   <p class="lead">${res.filter(x=>x.s).length} من ${res.length} اسمًا طابقت طالبات. اختاري الأداة؛ إذا كانت أداتها من درجة أعلى من الملف (مثل اختبار من ١٠ وأداته من ٢٠) تُحوَّل الدرجة تلقائيًا.</p>
   <div class="row"><select id="impTool">${tools.map(t=>`<option value="${t.id}">${esc(t.name)} (من ${t.max})</option>`).join("")}<option value="__new">أداة جديدة…</option></select><input type="text" id="impNew" placeholder="اسم الأداة الجديدة" hidden><button class="btn pri" id="impGo">رصد</button></div>
   <div class="scroll" style="max-height:50vh"><table class="g"><thead><tr><th class="n">الاسم في الملف</th><th>الدرجة</th><th>الطالبة في المنصة</th></tr></thead><tbody>${res.map(x=>`<tr><td class="n">${esc(x.name)}</td><td class="num">${x.g}</td><td>${x.s?esc(x.s.name)+(x.cid!==S.cls?` <span class="pill mut">${esc(S.classes[x.cid].name)}</span>`:""):`<span class="pill bad">لم تُطابق</span>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#ov").hidden=false;
}
async function doImport(){const sel=$("#impTool").value,res=S.imp.res,name=$("#impNew").value.trim();
  const by={};for(const x of res)if(x.s)(by[x.cid]=by[x.cid]||[]).push(x);
  for(const [cid,arr] of Object.entries(by)){const c=S.classes[cid];let tid=sel;
    if(sel==="__new"){if(!name){toast("اكتبي اسم الأداة");return}tid="t"+Date.now().toString(36);c.tools=[...(c.tools||[]),{id:tid,name,max:S.imp.defMax}]}
    else if(!(c.tools||[]).some(t=>t.id===tid)){const src=(S.classes[S.cls].tools||[]).find(t=>t.id===tid);c.tools=[...(c.tools||[]),{...src}]}
    const tmax=+((c.tools||[]).find(t=>t.id===tid)||{max:S.imp.defMax}).max;c.grades=c.grades||{};
    for(const x of arr){c.grades[x.s.id]=c.grades[x.s.id]||{};c.grades[x.s.id][tid]=Math.round(x.g*(tmax/(x.max||tmax))*100)/100}
    await saveClass(cid,{tools:c.tools,grades:c.grades})}
  $("#ov").hidden=true;toast("رُصدت "+res.filter(x=>x.s).length+" درجة");render()}

  else if(b.dataset.seturl){const l=(S.config.links||[]).find(x=>x.id===b.dataset.seturl);
    $("#ovw").innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between"><h2>رابط «${esc(l.title)}»</h2><button class="btn" id="ovx">✕</button></div><p class="lead">الصقي رابط الملف أو المجلد من OneDrive أو Google Drive.</p><input type="url" id="suU" dir="ltr" placeholder="https://…"><div class="row"><button class="btn pri" id="suS" data-id="${l.id}">حفظ</button></div></div>`;$("#ov").hidden=false;$("#suU").focus()}
  else if(b.id==="suS"){const u=safeUrl($("#suU").value);if(!u){toast("الرابط يجب أن يبدأ بـ https://");return}$("#ov").hidden=true;saveLinks((S.config.links||[]).map(x=>x.id===b.dataset.id?{...x,url:u}:x))}
  else if(b.dataset.addlink){const g=b.dataset.addlink,ti=$("#lt-"+g).value.trim(),u=safeUrl($("#lu-"+g).value),no=$("#ln-"+g).value.trim();
    if(!ti||!u){toast("اكتبي اسم المجلد والصقي رابطًا يبدأ بـ https://");return}
    saveLinks([...(S.config.links||[]),{id:"l"+Date.now().toString(36),group:g,title:ti,note:no,url:u}])}
  else if(b.dataset.dellink){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="تأكيد الحذف";return}
    saveLinks((S.config.links||[]).filter(l=>l.id!==b.dataset.dellink))}
  else if(b.id==="shareF"){try{await navigator.clipboard.writeText(S.config.foldersPage);toast("نُسخ رابط صفحة ملفات الإنجاز")}catch(_){prompt("انسخي الرابط:",S.config.foldersPage)}}
  else if(b.id==="exp")exportXlsx();
  else if(b.id==="impGo")doImport();
  else if(b.id==="bulkFold")bulkFolders();
  else if(b.id==="fSave"&&b.dataset.sid==="__class"){const u=safeUrl($("#fUrl").value);if(!u){toast("الصقي رابطًا يبدأ بـ https://");return}S.classes[S.cls].folder=u;if(await saveClass(S.cls,{folder:u})){$("#ov").hidden=true;toast("حُفظ رابط مجلد الفصل");render()}}
  else if(b.id==="fDel"&&b.dataset.sid==="__class"){S.classes[S.cls].folder="";if(await saveClass(S.cls,{folder:""})){$("#ov").hidden=true;render()}}
  else if(b.id==="fSave"){const u=safeUrl($("#fUrl").value);if(!u){toast("الصقي رابطًا يبدأ بـ https://");return}const f={...(S.classes[S.cls].folders||{}),[b.dataset.sid]:u};if(await saveFolders(f)){$("#ov").hidden=true;toast("حُفظ رابط المجلد");render()}}
  else if(b.id==="fDel"){const f={...(S.classes[S.cls].folders||{})};delete f[b.dataset.sid];if(await saveFolders(f)){$("#ov").hidden=true;toast("حُذف الرابط");render()}}
  else if(b.id==="bulkGo"){const c=S.classes[S.cls],f={...(c.folders||{})};let ok=0,miss=[];
    for(const line of $("#bulkTxt").value.split(/\n+/)){const m=line.match(/(https:\/\/\S+)/);if(!m)continue;const nm=line.replace(m[1],"").replace(/[|\-–:،,]+/g," ").trim();const s=matchName(c,nm);if(s){f[s.id]=m[1];ok++}else miss.push(nm)}
    if(ok&&await saveFolders(f)){toast("رُبط "+ok+" مجلدًا")}$("#bulkMsg").textContent=`رُبط ${ok}`+(miss.length?` · لم تُطابق: ${miss.join("، ")}`:"");if(!miss.length&&ok){$("#ov").hidden=true;render()}}
  else if(b.id==="saveCf"){const cf={...S.config};document.querySelectorAll("[data-cf]").forEach(i=>cf[i.dataset.cf]=i.type==="number"?+i.value:i.value.trim());
    try{await S.db.doc("school/config").set(cf);toast("حُفظت الإعدادات")}catch(_){toast("لم تُحفظ الإعدادات")}}
  else if(b.id==="addTool"){const n=$("#ntName").value.trim(),m=+$("#ntMax").value;if(!n||!m){toast("اكتبي اسم الأداة ودرجتها العظمى");return}
    const c=S.classes[S.cls];await saveClass(S.cls,{tools:[...(c.tools||[]),{id:"t"+Date.now().toString(36),name:n,max:m}]});toast("أُضيفت الأداة")}
  else if(b.dataset.deltool){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="تأكيد الحذف";return}
    const c=S.classes[S.cls];await saveClass(S.cls,{tools:(c.tools||[]).filter(t=>t.id!==b.dataset.deltool)});toast("حُذفت الأداة")}
  else if(b.id==="addStu"){const n=$("#nsName").value.trim();if(!n)return;const c=S.classes[S.cls];await saveClass(S.cls,{students:[...(c.students||[]),{id:"s"+Date.now().toString(36),name:n}]});toast("أُضيفت الطالبة")}
  else if(b.id==="addCls"){const n=$("#ncName").value.trim(),sb=$("#ncSub").value.trim();if(!n)return;const id="c"+Date.now().toString(36);
    try{await S.db.doc("school/"+id).set({name:n,subject:sb,order:classList().length+1,tools:[],students:[],grades:{}});S.cls=id;toast("أُضيف الفصل")}catch(_){toast("لم يُضف الفصل")}}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
  else if(t.dataset.s&&t.dataset.t){queueGrade(t.dataset.s,t.dataset.t,t.value)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="imp"&&t.files[0]){importFile(t.files[0]).catch(()=>toast("تعذّرت قراءة الملف"));t.value=""}
  else if(t.dataset.pst!=null){const ps={...(S.config.pship||{})};ps[t.dataset.pst]={...(ps[t.dataset.pst]||{}),s:+t.value};savePship(ps)}
  else if(t.id==="impTool"){$("#impNew").hidden=t.value!=="__new"}
  else if(t.dataset.f){const k=t.dataset.f,f=S.follow[k]=S.follow[k]||{};
    if(t.type==="checkbox"){const box=t.closest(".chk");f[t.dataset.k]=[...box.querySelectorAll(`input[data-k="${t.dataset.k}"]:checked`)].map(x=>x.value)}
    else f[t.dataset.k]=t.value; f.at=new Date().toISOString(); saveFollow(k)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#ov").hidden=true});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")$("#ov").hidden=true});
window.addEventListener("resize",fitCert);

/* ---------- boot ---------- */
(function(){try{const h=location.hash.slice(1);if(["home","grades","folders","library","community","plans","certs","analysis","settings"].includes(h))S.view=h}catch(_){}})();
render();
(async()=>{
  const [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  S.db=db;S.dl=dl;
  const owner=user?await user.isOwner():false, canData=user?await user.can("data.write"):null;
  S.canWrite=owner; S.canFollow=owner||canData!==false;
  $("#role").textContent=owner?"صاحبة المنصة":S.canFollow?"متابعة الخطط":"عرض فقط";
  if(!db){S.ready=true;$("#main").innerHTML='<div class="panel"><h1>سجّلي الدخول لعرض البيانات</h1><p class="lead">بيانات الطالبات محفوظة في المنصة وتظهر بعد تسجيل الدخول بحساب له صلاحية.</p></div>';return}
  db.collection("school").onSnapshot(snap=>{const cls={};for(const d of snap.docs){if(d.id==="config")S.config=d.data()||{};else{const x=d.data();if(x&&Array.isArray(x.students))cls[d.id]=x}}
    S.classes=cls;S.ready=true;const a=document.activeElement;if(a&&a.dataset&&(a.dataset.s||a.id==="fUrl"||a.id==="bulkTxt"||/^l[tnu]-/.test(a.id)||a.dataset.cf))return;if(!$("#ov").hidden)return;render()},()=>{S.ready=true;render()});
  db.collection("followups").onSnapshot(snap=>{const f={};for(const d of snap.docs)f[d.id]=d.data();S.follow=f;if(S.view==="plans"&&!document.activeElement?.dataset?.f)render()});
})();
</script>
</html>
