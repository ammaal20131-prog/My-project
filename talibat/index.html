<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملفات إنجاز الطالبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F2;--card:#fff;--fg:#1F2D2A;--muted:#5E6E6A;--line:#DCE5E1;--brand:#2F6B5C;--brand-2:#E3F0EB;--sand:#F4ECDD;--accent:#B8863B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1A2320;--fg:#E7EFEC;--muted:#9FB1AB;--line:#2A3833;--brand:#7CC2AE;--brand-2:#1F302B;--sand:#2A2519;--accent:#E0B36A}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.6;padding:0 max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:max(16px,env(safe-area-inset-top))}
.cover{border-radius:22px;padding:26px 20px 22px;color:#fff;text-align:center;background:radial-gradient(120% 90% at 100% 0%,#5E9C88 0%,#2F6B5C 55%,#244F45 100%)}
.cover img{width:74px;height:auto;background:#fff;border-radius:14px;padding:6px}
.cover h1{font-family:"El Messiri",serif;font-size:28px;margin:10px 0 2px}
.cover p{margin:0;opacity:.9;font-size:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step h2{margin:0;font-family:"El Messiri",serif;font-size:19px;display:flex;align-items:center;gap:8px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:14px;font-family:"Tajawal"}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:14px 10px;cursor:pointer;min-height:52px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
input[type=search]{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
input[type=search]:focus-visible,.chip:focus-visible,.nm:focus-visible,.open:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.nm{font:inherit;text-align:right;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.nm b{font-weight:500}.nm span{color:var(--muted);font-size:13px;white-space:nowrap}
.me{display:flex;flex-direction:column;gap:12px}
.me h3{margin:0;font-family:"El Messiri",serif;font-size:21px;color:var(--brand)}
.open{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--brand);color:#fff;font-weight:700;font-size:18px;border-radius:14px;padding:16px;min-height:56px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--brand-2);display:flex;flex-direction:column;gap:2px}
.box b{font-size:15px}.box small{color:var(--muted);font-size:13px}.box .c{font-family:"El Messiri",serif;font-size:22px;color:var(--brand)}
.box.zero{background:var(--sand)}.box.zero .c{color:var(--accent)}
.tip{background:var(--sand);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--fg)}
.tip ol{margin:4px 0 0;padding-right:20px}
.back{font:inherit;background:none;border:none;color:var(--brand);cursor:pointer;padding:4px 0;align-self:flex-start;font-weight:700}
.up{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--brand-2);min-height:64px}
.up .ic{font-size:26px}.up .tx{flex:1;display:flex;flex-direction:column}.up .tx b{font-size:17px}.up .tx small{color:var(--muted);font-size:13px}
.up .go{background:var(--brand);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.up.zero{background:var(--sand)}.ups{display:flex;flex-direction:column;gap:10px}
.open2{color:var(--brand);font-weight:700;text-align:center;text-decoration:none;padding:6px}
footer{text-align:center;color:var(--muted);font-size:13px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
